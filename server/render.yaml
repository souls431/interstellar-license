services:
  - type: web
    name: interstellar-license
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: interstellar-db
          property: connectionString

databases:
  - name: interstellar-db
    plan: free